<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SORA → Coinpanda export</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.6rem; font-size: 1rem; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; margin-top: 0.75rem; cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.6; }
  #status { margin-top: 1rem; white-space: pre-wrap; }
  a.run-link { font-size: 0.85rem; }
  #history { margin-top: 2rem; }
  #history h2 { font-size: 1rem; }
  #history ul { list-style: none; padding: 0; }
  #history li { padding: 0.4rem 0; border-bottom: 1px solid rgba(128,128,128,0.3); display: flex; justify-content: space-between; gap: 1rem; }
  #history .addr { font-family: monospace; font-size: 0.85rem; }
  #history .state { font-size: 0.85rem; }
</style>
</head>
<body>
<h1>SORA → Coinpanda export</h1>
<p>Enter a SORA address. This scans the full chain history for it, which takes a
few minutes for small wallets and up to an hour for very active ones. You can
close this tab — the job keeps running on GitHub, and reopening this page (or
the link it gives you) picks it back up.</p>
<input id="address" placeholder="cn..." autocomplete="off" spellcheck="false">
<button id="go">Export</button>
<div id="status"></div>

<div id="history"></div>

<script>
const addressEl = document.getElementById('address');
const statusEl = document.getElementById('status');
const goBtn = document.getElementById('go');
const historyEl = document.getElementById('history');

const STORAGE_KEY = 'soraExportJobs';
const MAX_HISTORY = 20;

function loadJobs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveJob(job) {
  try {
    const jobs = loadJobs().filter((j) => j.jobId !== job.jobId);
    jobs.unshift(job);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(jobs.slice(0, MAX_HISTORY)));
  } catch { /* localStorage unavailable (private mode etc) - job still works this session */ }
}

function updateJobState(jobId, patch) {
  const jobs = loadJobs();
  const job = jobs.find((j) => j.jobId === jobId);
  if (job) { Object.assign(job, patch); saveJob(job); }
}

function renderHistory() {
  const jobs = loadJobs();
  if (!jobs.length) { historyEl.innerHTML = ''; return; }
  historyEl.innerHTML = '<h2>Recent exports (this browser)</h2><ul>' +
    jobs.map((j) => `<li>
      <span class="addr">${j.address || j.jobId.slice(0, 8)}</span>
      <span class="state">${describeState(j)}</span>
    </li>`).join('') + '</ul>';
}

function describeState(j) {
  if (j.state === 'done') return `<a href="/api/download?jobId=${j.jobId}">Download CSV</a>`;
  if (j.state === 'failed') return `failed — <a class="run-link" href="${j.runUrl || '#'}" target="_blank">log</a>`;
  return `<a href="?job=${j.jobId}">still running / check</a>`;
}

async function poll(jobId) {
  let data;
  try {
    const res = await fetch(`/api/status?jobId=${jobId}`);
    data = await res.json();
  } catch {
    statusEl.textContent = 'Network error checking status, retrying...';
    setTimeout(() => poll(jobId), 10000);
    return;
  }

  if (data.state === 'pending') {
    statusEl.textContent = 'Waiting for the job to start...';
  } else if (data.state === 'running') {
    statusEl.innerHTML = `Scanning the chain, this can take a while — safe to close this tab, this page (or its link) will pick it back up. <a class="run-link" href="${data.runUrl}" target="_blank">view live log</a>`;
    updateJobState(jobId, { state: 'running', runUrl: data.runUrl });
  } else if (data.state === 'done') {
    statusEl.innerHTML = `Done. <a href="/api/download?jobId=${jobId}">Download CSV</a>`;
    updateJobState(jobId, { state: 'done' });
    goBtn.disabled = false;
    renderHistory();
    return;
  } else if (data.state === 'failed') {
    statusEl.innerHTML = `Export failed (${data.conclusion || 'unknown'}). <a class="run-link" href="${data.runUrl}" target="_blank">view log</a>`;
    updateJobState(jobId, { state: 'failed', runUrl: data.runUrl });
    goBtn.disabled = false;
    renderHistory();
    return;
  } else {
    statusEl.textContent = data.error || 'unknown error';
    goBtn.disabled = false;
    return;
  }
  setTimeout(() => poll(jobId), 10000);
}

async function checkOne(job) {
  try {
    const res = await fetch(`/api/status?jobId=${job.jobId}`);
    const data = await res.json();
    if (data.state === 'done' || data.state === 'failed' || data.state === 'running') {
      updateJobState(job.jobId, { state: data.state, runUrl: data.runUrl, conclusion: data.conclusion });
    }
  } catch { /* leave as-is, retried next cycle */ }
}

// Jobs in the history list aren't otherwise checked unless you're actively
// polling them (e.g. via the URL's ?job=), so they'd show a stale "running"
// forever. Refresh every non-finished one in the background instead.
async function refreshHistory() {
  const pending = loadJobs().filter((j) => j.state !== 'done' && j.state !== 'failed');
  if (!pending.length) return;
  await Promise.all(pending.map(checkOne));
  renderHistory();
  if (loadJobs().some((j) => j.state !== 'done' && j.state !== 'failed')) {
    setTimeout(refreshHistory, 10000);
  }
}

function startPolling(jobId, address) {
  const url = new URL(location.href);
  url.searchParams.set('job', jobId);
  history.replaceState(null, '', url);
  saveJob({ jobId, address, state: 'running', startedAt: Date.now() });
  renderHistory();
  poll(jobId);
}

goBtn.addEventListener('click', async () => {
  const address = addressEl.value.trim();
  if (!address) return;
  goBtn.disabled = true;
  statusEl.textContent = 'Starting export...';
  const res = await fetch('/api/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ address }),
  });
  const data = await res.json();
  if (!res.ok) {
    statusEl.textContent = data.error || 'could not start export';
    goBtn.disabled = false;
    return;
  }
  startPolling(data.jobId, address);
});

renderHistory();
refreshHistory();
const resumeJobId = new URL(location.href).searchParams.get('job');
if (resumeJobId) {
  goBtn.disabled = true;
  statusEl.textContent = 'Resuming...';
  poll(resumeJobId);
}
</script>
</body>
</html>
